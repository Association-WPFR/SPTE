<!--
	Structure réduite du tableau des locales d'une page de projet GlotPress (#translation-sets, ex: /projects/wp/dev/admin/).
	Le français est placé volontairement en 3e position pour tester moveFrenchRowToFirst() sur ce tableau.
-->
<div id="translation-sets">
	<table class="gp-table translation-sets">
		<thead>
			<tr>
				<th class="gp-column-locale">Locale</th>
				<th class="gp-column-percent">%</th>
			</tr>
		</thead>
		<tbody>
			<tr class="odd">
				<td><strong><a href="/projects/wp/dev/admin/bg/default/">Bulgarian</a></strong><span class="bubble morethan90">100%</span></td>
				<td>100%</td>
			</tr>
			<tr class="even">
				<td><strong><a href="/projects/wp/dev/admin/fr-be/default/">French (Belgium)</a></strong><span class="bubble morethan90">100%</span></td>
				<td>99%</td>
			</tr>
			<tr class="odd">
				<td><strong><a href="/projects/wp/dev/admin/fr/default/">French (France)</a></strong><span class="bubble morethan90">100%</span></td>
				<td>100%</td>
			</tr>
			<tr class="even">
				<td><strong><a href="/projects/wp/dev/admin/de/default/">German</a></strong><span class="bubble morethan90">100%</span></td>
				<td>100%</td>
			</tr>
		</tbody>
	</table>
</div>
